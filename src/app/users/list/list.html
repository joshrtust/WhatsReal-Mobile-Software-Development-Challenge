<h1>Users</h1>

@if (loading()) {
  <p>Users are loading...</p>
} @else if (error()) {
  <p>{{ error() }}</p>
} @else {
  <ul>
    @for (user of users(); track user.id) {
      <li>
        <app-list-item
          [user]="user"
          [expanded]="expanded() === user.id"
          (toggle)="toggleUser(user.id)"
        ></app-list-item>
      </li>
    } @empty {
      <p>No users found.</p>
    }
  </ul>
}
